name: Synthetic tests and lint
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements.txt
            requirements-dev.txt
      - name: Install tested CPU runtime
        run: |
          python -m venv venv
          ./venv/bin/python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          ./venv/bin/python -m pip install -r requirements-dev.txt
      - name: Check undefined symbols
        run: ./venv/bin/python -m ruff check recommender tests experiments tools --select F821,F822,F823
      - name: Run without private data, checkpoints or embedding downloads
        run: PYTHONPATH=. ./venv/bin/pytest tests/ --synthetic-only -q
