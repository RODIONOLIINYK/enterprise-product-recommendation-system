<!doctype html><html><head><meta charset="utf-8"><style>
:root{font-family:var(--font-sans)}*{box-sizing:border-box}body{margin:0;color:var(--foreground)}.intro{font-size:14px;color:var(--muted-foreground);margin:0 0 12px}.buttons{display:flex;gap:8px;margin-bottom:18px}button{font:inherit;font-size:13px;border:1px solid var(--border);color:var(--foreground);background:var(--secondary);padding:8px 12px;border-radius:var(--radius);cursor:pointer}button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}.panel{background:var(--card);padding:16px;border-radius:var(--radius);margin:10px 0}.label{font-size:14px;font-weight:600}svg{width:100%;height:108px;display:block}text{fill:var(--foreground);font-family:var(--font-sans);font-size:12px}.note{font-size:12px;color:var(--muted-foreground);line-height:1.5;margin-top:12px}line{stroke:var(--border)}
</style></head><body><p class="intro">Stage 2 · same rolling slates · 6,191 validation queries · seed 42</p><div class="buttons"><button id="ndcg" aria-pressed="true">NDCG-selected</button><button id="discovery" aria-pressed="false">Discovery-selected</button></div><div id="plots"></div><p class="note">Each bar starts at zero. New hits denominator: 1,857 new targets. Single training seed; references unchanged.</p><script>
const data={"ndcg": [{"label": "A \u00b7 Pointwise control", "epoch": 8, "recall": 77.10428905121539, "ndcg": 0.6022285424774492, "new": 255}, {"label": "B \u00b7 Candidate attention", "epoch": 9, "recall": 76.7441834942515, "ndcg": 0.5988992100906649, "new": 252}, {"label": "C \u00b7 Attention + enrichment", "epoch": 9, "recall": 76.6470941660202, "ndcg": 0.6001221249917726, "new": 239}], "discovery": [{"label": "A \u00b7 Pointwise control", "epoch": 8, "recall": 77.10428905121539, "ndcg": 0.6022285424774492, "new": 255}, {"label": "B \u00b7 Candidate attention", "epoch": 9, "recall": 76.7441834942515, "ndcg": 0.5988992100906649, "new": 252}, {"label": "C \u00b7 Attention + enrichment", "epoch": 6, "recall": 77.09990101924701, "ndcg": 0.5996290710501742, "new": 255}]};function render(sel){for(const name of ['ndcg','discovery'])document.getElementById(name).setAttribute('aria-pressed',name===sel);const rows=data[sel];document.getElementById('plots').innerHTML=[['recall','Overall Recall@10',100,v=>v.toFixed(3)+'%'],['ndcg','NDCG@10',1,v=>v.toFixed(5)],['new','New-product hits@10',300,v=>v+' / 1,857']].map(([key,title,max,fmt])=>'<div class="panel"><div class="label">'+title+'</div><svg viewBox="0 0 650 108" role="img" aria-label="'+title+'">'+rows.map((r,i)=>{const y=20+i*34;return '<text x="0" y="'+y+'">'+r.label+'</text><rect x="215" y="'+(y-11)+'" width="'+(r[key]/max*288)+'" height="16" rx="3" style="fill:var(--chart-'+(i+1)+')"/><text x="515" y="'+y+'">'+fmt(r[key])+'</text>'}).join('')+'</svg></div>').join('')}
for(const sel of ['ndcg','discovery'])document.getElementById(sel).onclick=()=>render(sel);render('ndcg');</script></body></html>
