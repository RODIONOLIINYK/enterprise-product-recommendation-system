<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans)}.controls{display:flex;gap:8px;margin-bottom:12px}button{padding:8px 12px;font:inherit;font-size:13px;background:var(--secondary);color:var(--foreground);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer}button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted-foreground);font-size:12px;margin-bottom:14px}.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}.cpu{background:var(--chart-1)}.mps{background:var(--chart-2)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}.label{font-size:13px;font-weight:600;min-height:35px;margin:0 0 12px}.value{font-size:14px;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;margin-bottom:6px}.track{height:12px;background:var(--secondary);overflow:hidden;border-radius:4px;margin-bottom:12px}.bar{height:100%;border-radius:4px}.axis{font-size:11px;color:var(--muted-foreground);display:flex;justify-content:space-between;margin-top:5px}.note{font-size:12px;line-height:1.5;color:var(--muted-foreground);margin:12px 0 0}.details{font-size:11px;color:var(--muted-foreground);margin:12px 0 0;line-height:1.5}</style></head><body><div class="controls" role="group" aria-label="Refresh size"><button id="batch" aria-pressed="true" onclick="render('batch')">Full development set</button><button id="single" aria-pressed="false" onclick="render('single')">Single-record updates</button></div><div class="legend"><span><i class="dot cpu"></i>CPU · 4 threads</span><span><i class="dot mps"></i>Apple M5 · MPS</span></div><div id="cards" class="cards"></div><p class="note">Warm encoder i  0.035230532133330904, "min_ms": 0.03404199378564954, "max_ms": 0.03679099609144032, "per_item_us": 35.083998227491975}, "mps": {"items": 1, "warmup": 3, "repeats": 15, "median_ms": 0.4507080011535436, "p90_ms": 0.5025585938710719, "mean_ms": 0.45934746934411425, "min_ms": 0.41766700451262295, "max_ms": 0.5542500002775341, "per_item_us": 450.7080011535436}}, {"label": "One customer update", "cpu": {"items": 1, "warmup": 3, "repeats": 15, "median_ms": 0.39870900218375027, "p90_ms": 0.40477460133843124, "mean_ms": 0.4008193325717002, "min_ms": 0.3927919897250831, "max_ms": 0.4292079829610884, "per_item_us": 398.7090021837503}, "mps": {"items": 1, "warmup": 3, "repeats": 15, "median_ms": 0.8716669981367886, "p90_ms": 0.9190330049023032, "mean_ms": 0.8896832664807638, "min_ms": 0.8523750002495944, "max_ms": 1.04674999602139, "per_item_us": 871.6669981367886}}]};function render(mode){for(const id of ['batch','single'])document.getElementById(id).setAttribute('aria-pressed',String(id===mode));document.getElementById('cards').innerHTML=d[mode].map(r=>{const max=Math.max(r.cpu.p90_ms,r.mps.p90_ms)*1.12;return '<div class="card"><p class="label">'+r.label+'</p>'+['cpu','mps'].map(dev=>'<div class="value"><span>'+dev.toUpperCase()+'</span><strong>'+r[dev].median_ms.toFixed(mode==='single'?3:2)+' ms</strong></div><div class="track"><div class="bar '+dev+'" style="width:'+(100*r[dev].median_ms/max)+'%"></div></div>').join('')+'<div class="axis"><span>0</span><span>'+max.toFixed(mode==='single'?2:1)+' ms</span></div><p class="details">P90 · CPU '+r.cpu.p90_ms.toFixed(mode==='single'?3:2)+' ms · MPS '+r.mps.p90_ms.toFixed(mode==='single'?3:2)+' ms</p></div>'}).join('')}render('batch')</script></body></html>
