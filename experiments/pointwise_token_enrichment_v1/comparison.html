<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;color:var(--foreground);font-family:var(--font-sans)}.intro,.note{font-size:12px;color:var(--muted-foreground);line-height:1.5}.buttons{display:flex;gap:8px;margin:12px 0}button{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font:inherit;font-size:13px;color:var(--foreground);background:var(--secondary);cursor:pointer}button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}.panel{background:var(--card);border-radius:var(--radius);padding:14px;margin:10px 0}.title{font-weight:600;font-size:14px}svg{display:block;width:100%;height:auto}text{fill:var(--foreground);font:12px var(--font-sans)}
</style></head><body><div class="intro">Stage 2 · 6,191 validation queries · same rolling slates · seed 42<br>D adds statistical token enrichment to the pointwise scorer. Only D was trained in this follow-up.</div><div class="buttons"><button id="ndcg" aria-pressed="true">NDCG-selected</button><button id="discovery" aria-pressed="false">Discovery-selected</button></div><div id="plots"></div><div class="note">All bars start at zero. New-hit denominator: all 1,857 new targets. No held-out access or reference promotion.</div><script>
const data={"ndcg": [{"name": "A \u00b7 Pointwise control", "epoch": 8, "recall": 77.10428905121539, "ndcg": 0.6022285424774492, "hits": 255}, {"name": "B \u00b7 Candidate attention", "epoch": 9, "recall": 76.7441834942515, "ndcg": 0.5988992100906649, "hits": 252}, {"name": "C \u00b7 Attention + enrichment", "epoch": 9, "recall": 76.6470941660202, "ndcg": 0.6001221249917726, "hits": 239}, {"name": "D \u00b7 Pointwise + enrichment", "epoch": 8, "recall": 76.88522111651189, "ndcg": 0.6003402074401483, "hits": 248}], "discovery": [{"name": "A \u00b7 Pointwise control", "epoch": 8, "recall": 77.10428905121539, "ndcg": 0.6022285424774492, "hits": 255}, {"name": "B \u00b7 Candidate attention", "epoch": 9, "recall": 76.7441834942515, "ndcg": 0.5988992100906649, "hits": 252}, {"name": "C \u00b7 Attention + enrichment", "epoch": 6, "recall": 77.09990101924701, "ndcg": 0.5996290710501742, "hits": 255}, {"name": "D \u00b7 Pointwise + enrichment", "epoch": 8, "recall": 76.88522111651189, "ndcg": 0.6003402074401483, "hits": 248}]};function render(sel){for(const name of ['ndcg','discovery'])document.getElementById(name).setAttribute('aria-pressed',name===sel);document.getElementById('plots').innerHTML=[['recall','Overall Recall@10',100,v=>v.toFixed(3)+'%'],['ndcg','NDCG@10',1,v=>v.toFixed(5)],['hits','New-product hits@10',300,v=>v+' / 1,857']].map(([key,title,max,fmt])=>'<div class="panel"><div class="title">'+title+'</div><svg viewBox="0 0 700 145" role="img" aria-label="'+title+'">'+data[sel].map((r,i)=>{let y=24+i*33;return '<text x="0" y="'+y+'">'+r.name+'</text><rect x="235" y="'+(y-12)+'" height="17" width="'+(r[key]/max*280)+'" rx="3" style="fill:var(--chart-'+(i+1)+')"/><text x="530" y="'+y+'">'+fmt(r[key])+'</text>'}).join('')+'</svg></div>').join('')}for(const sel of ['ndcg','discovery'])document.getElementById(sel).onclick=()=>render(sel);render('ndcg');</script></body></html>
